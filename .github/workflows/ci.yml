name: Build and test
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --locked -p wtp-endpoint
      - run: python scripts/check-platform-plans.py
      - run: python scripts/check-dependencies.py
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: wtp-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/wtp
            target/release/wtp.exe
            target/release/wtp-native
            target/release/wtp-native.exe
            target/release/wtp-agent
            target/release/wtp-agent.exe
            target/release/wtp-desktop
            target/release/wtp-desktop.exe
          if-no-files-found: error
  browser:
    name: Console and extension · Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Verify release and CRX signatures
        run: python3 tests/endpoint/release_probe.py --chrome "$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")"
      - name: Kernel enforcement in disposable network namespaces
        run: python3 scripts/linux-integration.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-screenshots
          path: artifacts/
  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      - run: python scripts/check-dependencies.py
      - run: cargo audit
