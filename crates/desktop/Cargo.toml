[package]
name = "wtp-desktop"
version = "0.3.0"
edition = "2024"
rust-version = "1.91"
license = "AGPL-3.0-or-later"
[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
wtp-control = { path = "../control" }
zeroize = "1"
