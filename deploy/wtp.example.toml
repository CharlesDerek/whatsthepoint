# Copy to wtp.toml and edit for your machine.
# The console is HTTP on loopback; use an HTTPS reverse proxy for remote access.
dns_bind = "127.0.0.1:53"
http_bind = "127.0.0.1:8080"
public_origin = "http://127.0.0.1:8080"
allowed_clients = ["127.0.0.0/8", "::1/128"]
cache_entries = 10000
query_log = true
retention_days = 7
max_log_entries = 100000

[[upstreams]]
url = "https://dns.quad9.net/dns-query"
bootstrap = "9.9.9.9:443"

[[upstreams]]
url = "https://dns.quad9.net/dns-query"
bootstrap = "149.112.112.112:443"
